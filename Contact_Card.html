<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Card - Avasa Hotels</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        .card-animate {
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body
    class="min-h-screen flex items-center justify-center p-4 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-gray-100 py-10">

    <div
        class="bg-white rounded-[2rem] shadow-2xl overflow-hidden max-w-sm w-full border border-gray-100 card-animate relative">
        <div
            class="absolute -top-24 -right-24 w-48 h-48 bg-blue-500 rounded-full mix-blend-multiply filter blur-2xl opacity-50">
        </div>
        <div
            class="absolute -bottom-24 -left-24 w-48 h-48 bg-indigo-500 rounded-full mix-blend-multiply filter blur-2xl opacity-50">
        </div>

        <!-- Header -->
        <div
            class="bg-gradient-to-br from-blue-600 to-indigo-700 p-8 pt-10 text-center relative z-10 rounded-b-[2rem] shadow-sm">
            <h2 class="text-3xl font-extrabold text-white tracking-widest mb-1 uppercase">Avasa Hotels</h2>
            <p class="text-blue-200 text-sm font-semibold tracking-wider">Kunal - Manager</p>
        </div>

        <!-- Content -->
        <div class="p-8 pt-10 relative z-10">
            <!-- QR Code Section -->
            <div class="flex flex-col items-center justify-center mb-8">
                <div
                    class="p-4 bg-white rounded-3xl shadow-lg border border-gray-100 ring-4 ring-blue-50 mb-4 transform hover:scale-105 transition duration-300">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=BEGIN%3AVCARD%0AVERSION%3A3.0%0AN%3A%3BKunal%3B%3B%3B%0AFN%3AKunal%20%28AVASA%20HOTELS%29%0AORG%3AAVASA%20HOTELS%0ATEL%3BTYPE%3DCELL%3A%2B918988903456%0ATEL%3BTYPE%3DWORK%3A%2B918010002608%0AEMAIL%3BTYPE%3DWORK%3AKunal%40avasahotels.in%0AADR%3BTYPE%3DWORK%3A%3B%3BSAJJANU%20VILLE%5C%2C%20Simsa%5C%2C%20MANALI%3BManali%3BHimachal%20Pradesh%3B175131%3BIndia%0AEND%3AVCARD"
                        alt="QR Code" class="w-48 h-48 object-contain rounded-xl">
                </div>
                <span
                    class="px-4 py-1.5 bg-indigo-50 text-indigo-700 text-xs font-bold rounded-full uppercase tracking-wider">
                    Scan to Save Contact
                </span>
            </div>

            <!-- Details List -->
            <div class="space-y-4">
                <!-- Phone -->
                <div
                    class="flex items-center p-4 rounded-2xl bg-gray-50 hover:bg-white hover:shadow-md border border-transparent hover:border-gray-100 transition-all duration-300 group">
                    <div
                        class="flex-shrink-0 bg-blue-100 p-3 rounded-xl text-blue-600 group-hover:scale-110 group-hover:bg-blue-600 group-hover:text-white transition-all duration-300">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                        </svg>
                    </div>
                    <div class="ml-4 flex flex-col justify-center">
                        <p class="text-[11px] text-gray-400 font-bold uppercase tracking-wider mb-0.5">Phone Number</p>
                        <p class="text-gray-900 font-bold text-base leading-tight mb-0.5">+91 89889 03456</p>
                        <p class="text-gray-900 font-bold text-base leading-tight">+91 80100 02608</p>
                    </div>
                </div>

                <!-- Email -->
                <div
                    class="flex items-center p-4 rounded-2xl bg-gray-50 hover:bg-white hover:shadow-md border border-transparent hover:border-gray-100 transition-all duration-300 group">
                    <div
                        class="flex-shrink-0 bg-indigo-100 p-3 rounded-xl text-indigo-600 group-hover:scale-110 group-hover:bg-indigo-600 group-hover:text-white transition-all duration-300">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                    </div>
                    <div class="ml-4">
                        <p class="text-[11px] text-gray-400 font-bold uppercase tracking-wider mb-0.5">Email Address</p>
                        <p class="text-gray-900 font-bold text-[15px] truncate w-48">Kunal@avasahotels.in</p>
                    </div>
                </div>

                <!-- Address -->
                <div
                    class="flex p-4 rounded-2xl bg-gray-50 hover:bg-white hover:shadow-md border border-transparent hover:border-gray-100 transition-all duration-300 group">
                    <div
                        class="flex-shrink-0 mt-1 bg-teal-100 p-3 rounded-xl text-teal-600 group-hover:scale-110 group-hover:bg-teal-600 group-hover:text-white transition-all duration-300">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </div>
                    <div class="ml-4">
                        <p class="text-[11px] text-gray-400 font-bold uppercase tracking-wider mb-1">Address</p>
                        <p class="text-gray-900 font-bold text-[13px] leading-snug">SAJJANU VILLE, Simsa,
                            MANALI,<br>Manali, Himachal Pradesh 175131</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
